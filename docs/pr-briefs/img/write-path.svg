<rect x="880" y="320" width="195" height="56" rx="8" fill="#eef0f2" stroke="#5f6b7a" stroke-width="1.6"/>
<text x="977.5" y="345.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1f">Relay (#44)</text>
<text x="977.5" y="361.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">every 2 s, SKIP LOCKED → log</text>
<rect x="420" y="320" width="205" height="56" rx="8" fill="#fef3e2" stroke="#d98a1c" stroke-width="1.6"/>
