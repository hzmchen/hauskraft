<text x="105.0" y="118.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">cookie + X-CSRF-Token</text>
<rect x="225" y="60" width="185" height="74" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.6"/>
