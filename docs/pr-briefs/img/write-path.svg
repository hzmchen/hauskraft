<text x="527.5" y="118.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">→ 422 problem+json</text>
<rect x="645" y="60" width="200" height="74" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
<text x="745.0" y="86.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1f">Task service (#39)</text>
<text x="745.0" y="102.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">SELECT … FOR UPDATE,</text>
<text x="745.0" y="118.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">version check → 409</text>
<rect x="440" y="190" width="190" height="74" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.6"/>
<text x="535.0" y="216.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1f">① ctx.authorize()</text>
<text x="535.0" y="232.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">NoOpPolicy in M0*;</text>
<text x="535.0" y="248.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">DenyAll → 403, no write</text>
<rect x="660" y="190" width="170" height="74" rx="8" fill="#f3e8fd" stroke="#8a4fd0" stroke-width="1.6"/>
<text x="745.0" y="216.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1f">② UPDATE tasks</text>
<text x="745.0" y="232.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">version + 1,</text>
<text x="745.0" y="248.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">updated_by = actor</text>
<rect x="860" y="190" width="215" height="74" rx="8" fill="#f3e8fd" stroke="#8a4fd0" stroke-width="1.6"/>
<text x="967.5" y="216.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d1d1f">③ ctx.emit() → outbox</text>
<text x="967.5" y="232.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">CloudEvent, actorid from</text>
<text x="967.5" y="248.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">authorize(), schema-checked</text>
<rect x="660" y="320" width="170" height="56" rx="8" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.6"/>
