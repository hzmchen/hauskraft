<text x="317.5" y="102.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">session, CSRF token,</text>
<text x="317.5" y="118.0" text-anchor="middle" font-size="11.5"  fill="#1d1d1f">Origin check (#32, #33)</text>
<rect x="445" y="60" width="165" height="74" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
