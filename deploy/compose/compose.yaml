# The Hauskraft stack (M0S-E11-01): `docker compose up --wait` from the repository root.
#   db       Postgres 16
#   migrate  one-shot: schema upgrade and demo seed (only into an empty database)
#   api      core API (FastAPI) with the built-in themes and ./data/themes
#   web      Caddy: the SPA and /api/* on one origin, published on HAUSKRAFT_WEB_PORT (8080), on this
#            machine only unless HAUSKRAFT_WEB_BIND says otherwise (M1S-E03-04, ADR 0017)
name: hauskraft

x-api-env: &api-env
  HAUSKRAFT_DATABASE_URL: postgresql+psycopg://hauskraft:hauskraft@db:5432/hauskraft
  HAUSKRAFT_ENV: ${HAUSKRAFT_ENV:-development}
  HAUSKRAFT_SECRET_KEY: ${HAUSKRAFT_SECRET_KEY:-}
  HAUSKRAFT_COOKIE_SECURE: ${HAUSKRAFT_COOKIE_SECURE:-false}
  HAUSKRAFT_ALLOWED_ORIGINS: ${HAUSKRAFT_ALLOWED_ORIGINS:-http://localhost:8080}
  HAUSKRAFT_DEFAULT_THEME: ${HAUSKRAFT_DEFAULT_THEME:-dev.hauskraft.theme.default}
  HAUSKRAFT_THEME_PATHS: /app/themes/builtin,/data/themes
  HAUSKRAFT_SEED_DEMO: ${HAUSKRAFT_SEED_DEMO:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hauskraft
      POSTGRES_PASSWORD: hauskraft
      POSTGRES_DB: hauskraft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hauskraft_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hauskraft -d hauskraft"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: services/core_api/Dockerfile
    image: hauskraft/core-api:dev
    command: ["sh", "-c", "hauskraft db upgrade && hauskraft seed --if-empty"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: hauskraft/core-api:dev
    environment: *api-env
    volumes:
      - ../../data/themes:/data/themes:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request, sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/readyz').status != 200)",
        ]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: hauskraft/web:dev
    ports:
      - "${HAUSKRAFT_WEB_BIND:-127.0.0.1}:${HAUSKRAFT_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  hauskraft_pg:
