# Overlay for the acceptance stack (M0S-E11-01): also loads the fixture themes, read-only, so the live
# suites can select them.
#   docker compose -f compose.yaml -f deploy/compose/compose.test.yaml up --wait
services:
  api:
    environment:
      HAUSKRAFT_THEME_PATHS: /app/themes/builtin,/data/themes,/fixtures/themes
    volumes:
      # Relative to the project directory (the repository root), where `-f` overlays resolve paths.
      - ./tests/fixtures/themes:/fixtures/themes:ro
