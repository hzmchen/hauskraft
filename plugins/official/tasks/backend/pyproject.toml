# SPDX-License-Identifier: MIT
[project]
name = "hauskraft-tasks"
version = "0.1.0"
description = "Hauskraft official tasks plugin (backend)."
license = "MIT"
requires-python = ">=3.13"
dependencies = ["hauskraft-sdk", "sqlalchemy[asyncio]~=2.1.4", "fastapi~=0.143.0", "pydantic>=2.12,<3"]

[tool.uv.sources]
hauskraft-sdk = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
