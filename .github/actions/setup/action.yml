# SPDX-License-Identifier: MIT
name: Set up HearthOS workspace
description: Install the uv workspace and/or the pnpm workspace with caching.
inputs:
  python:
    description: Install the uv workspace
    default: "true"
  node:
    description: Install Node 24 and the pnpm workspace
    default: "true"
runs:
  using: composite
  steps:
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - if: inputs.python == 'true'
      shell: bash
      run: uv sync --all-packages --locked
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@v6.1.0
    - if: inputs.node == 'true'
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
