# SPDX-License-Identifier: MIT
# Bootstrap gate for the hand-off: docs validation plus the static acceptance suite.
# M0S-E02-01 folds this into ci.yml as the `acceptance` job; delete this file then.
name: acceptance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The uv workspace provides the suite's pins plus the tools green stories rely on (ruff, mypy).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      # ESLint-based checks need the pnpm workspace (pnpm version comes from package.json packageManager).
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate spec, backlog, story status and coverage
        run: uv run python scripts/backlog_tools.py check
      - name: Static acceptance suite (red stories report as xfail)
        run: uv run pytest tests --strict-status -ra
