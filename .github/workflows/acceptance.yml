# SPDX-License-Identifier: MIT
# Bootstrap gate for the hand-off: docs validation plus the static acceptance suite.
# M0S-E02-01 folds this into ci.yml as the `acceptance` job; delete this file then.
name: acceptance

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r tests/requirements.txt
      - name: Validate spec, backlog, story status and coverage
        run: python scripts/backlog_tools.py check
      - name: Static acceptance suite (red stories report as xfail)
        run: python -m pytest tests --strict-status -ra
