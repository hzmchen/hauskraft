# SPDX-License-Identifier: MIT
# Fast PR gate (M0S-E02-01): independent jobs run in parallel; any failure blocks the merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: uv run mypy
      - run: pnpm typecheck

  unit-py:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "false"
      # pyproject testpaths point at the package test folders; the spec-owned suite runs in `acceptance`.
      - run: uv run pytest -m unit -q

  unit-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "false"
      # Vitest's browser project (M0S-E08-01) runs in Chromium.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm -r --if-present --filter '!@hearthos/acceptance-e2e' test -- --run

  # M0S-E02-02: DB-backed integration tests (Testcontainers Postgres 16), contract tests, and drift of
  # generated artefacts (OpenAPI, TS client, plugin registry, theme types).
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: extractions/setup-just@v4.0.0
      - run: uv run pytest -m "integration or contract" -q
      - name: Generated artefacts are up to date
        run: |
          just gen
          git diff --exit-code
      - name: Built-in themes and template validate, guide doc-test (M0S-E13-09)
        run: just themes-validate

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Validate spec, backlog, story status and coverage
        run: uv run python scripts/backlog_tools.py check
      - name: Spec-owned acceptance suite (red stories report as xfail)
        run: uv run python -m pytest tests --strict-status -ra

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check relative links in Markdown (offline)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
          fail: true

  # M0S-E02-04: every commit in a PR carries a DCO sign-off.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off your commits (DCO, see CONTRIBUTING.md):"
            echo "  last commit only:  git commit -s --amend --no-edit && git push --force-with-lease"
            echo "  all commits:       git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

  # M0S-E02-04: REUSE compliance and the licence map (spec §4.2).
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: uvx reuse==6.2.0 lint
      - run: uv run python scripts/check-licence-map.py
      - name: Dependency licences (report only in M0*)
        continue-on-error: true
        run: |
          uv run --with pip-licenses==5.5.5 pip-licenses --partial-match \
            --allow-only "MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL-2.0;Unlicense;CC0;LGPL;AGPL;Mozilla Public License 2.0"
          pnpm licenses list --prod

  # M0S-E02-05: lockfiles are current, free of denylisted versions and of known production vulnerabilities.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv lock --check
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/check-denylist.mjs pnpm-lock.yaml
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm audit --prod --audit-level high
