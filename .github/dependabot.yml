# SPDX-License-Identifier: MIT
# Weekly, grouped dependency updates (M0S-E02-05). Review lockfile diffs before merging; pnpm's
# minimumReleaseAge policy and scripts/check-denylist.mjs guard against freshly compromised releases.
# Major versions are pinned on purpose (stack table in docs/backlog/m0-star/README.md, ADR-0011) and are
# upgraded deliberately, so Dependabot proposes only minor and patch updates for them.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # TypeScript stays on ~6.0 until 7.x has a stable compiler API (ADR-0011).
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      # Playwright's packages require each other's exact version, so they move in one PR. Without this group
      # they split: Dependabot counts the pnpm catalog entries (`playwright`) as production dependencies and
      # `@playwright/test` as a development one, and either PR alone fails typecheck and e2e.
      playwright:
        patterns: ["playwright", "playwright-core", "@playwright/*"]
      # New axe-core releases can add accessibility rules that fail the e2e suite. Review them on their own,
      # so they don't hold back the rest of the dev tooling.
      axe:
        patterns: ["axe-core", "@axe-core/*"]
      npm-dev-tooling:
        dependency-type: development
        exclude-patterns: ["playwright", "playwright-core", "@playwright/*", "axe-core", "@axe-core/*"]
      npm-runtime:
        dependency-type: production
        exclude-patterns: ["playwright", "playwright-core", "@playwright/*", "axe-core", "@axe-core/*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/services/core_api", "/apps/web"]
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly, day: monday }
    ignore:
      # Postgres 16 is the pinned database (stack table, ADR-0009 mentions PG18 only as a later option).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]
