# SPDX-License-Identifier: MIT
# Weekly, grouped dependency updates (M0S-E02-05). Review lockfile diffs before merging; pnpm's
# minimumReleaseAge policy and scripts/check-denylist.mjs guard against freshly compromised releases.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-dev-tooling:
        dependency-type: development
      npm-runtime:
        dependency-type: production

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/services/core_api", "/apps/web"]
    schedule: { interval: weekly, day: monday }
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly, day: monday }
    groups:
      compose-images:
        patterns: ["*"]
