# SPDX-License-Identifier: AGPL-3.0-or-later
# REUSE annotations (https://reuse.software). Source files carry their own SPDX-License-Identifier header;
# this file adds the copyright line and licences files that cannot carry a comment (JSON, lockfiles,
# fonts, images, generated files). When several annotations match a path, the last one wins.
version = 1

# ------------------------------------------------------------------ Default: AGPL core and repository tooling
# Matches everything; the more specific annotations below override it.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 HearthOS contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# ------------------------------------------------------------------ MIT: plugin-facing parts, docs, CI
[[annotations]]
path = [
    "packages/**", "plugins/**", "themes/**", "integrations/**",
    "scripts/**", "docs/**", ".github/**",
    "README.md", "AGENTS.md", "CONTRIBUTING.md", "LICENSING.md", "SECURITY.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 HearthOS contributors"
SPDX-License-Identifier = "MIT"

# ------------------------------------------------------------------ Contributor Covenant 3.0
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ------------------------------------------------------------------ Spec-owned acceptance suite (MIT)
# "override": the suite's own files mention SPDX strings in test code and fixtures on purpose.
[[annotations]]
path = "tests/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 HearthOS contributors"
SPDX-License-Identifier = "MIT"

# ------------------------------------------------------------------ JSON Schemas (MIT)
# Schemas state their licence in "$comment"; "override" stops REUSE from parsing that JSON string as a tag.
[[annotations]]
path = "packages/schemas/**/*.json"
precedence = "override"
SPDX-FileCopyrightText = "2026 HearthOS contributors"
SPDX-License-Identifier = "MIT"

# ------------------------------------------------------------------ Built-in theme fonts (OFL-1.1, M0S-E13-06)
# Subsets built by scripts/subset-fonts.py from google/fonts; the licence text is LICENSES/OFL-1.1.txt.
[[annotations]]
path = "themes/builtin/default/assets/fonts/Inter-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "themes/builtin/paper/assets/fonts/SourceSerif4-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2014 The Source Serif 4 Project Authors (https://github.com/adobe-fonts/source-serif)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "themes/builtin/paper/assets/fonts/AtkinsonHyperlegibleNext-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "themes/builtin/hackspace/assets/fonts/VT323-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2011 The VT323 Project Authors (peter.hull@oikoi.com)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "themes/builtin/hackspace/assets/fonts/JetBrainsMono-*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# ------------------------------------------------------------------ Hackspace icon sprite (Pixelarticons, MIT)
# Built by scripts/build-hackspace-icons.py; licence text in themes/builtin/hackspace/LICENSES/.
[[annotations]]
path = "themes/builtin/hackspace/assets/icons/sprite.svg"
precedence = "override"
SPDX-FileCopyrightText = "2019 Gerrit Halfmann (Pixelarticons)"
SPDX-License-Identifier = "MIT"
