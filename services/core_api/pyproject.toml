# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "hearthos-core"
version = "0.1.0"
description = "HearthOS core API (FastAPI)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "hearthos-sdk",
    "fastapi~=0.143.0",
    "uvicorn[standard]~=0.54.0",
    "pydantic>=2.12,<3",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.1.4",
    "psycopg[binary]~=3.3",
    "structlog~=26.1",
    "alembic~=1.20",
    "uuid6>=2025.0.1",
    "jsonschema~=4.26",
    "pwdlib[argon2]~=0.3.1",
    "typer~=0.27",
    "semantic-version~=2.10",
]

[project.scripts]
hearthos = "hearthos_core.cli:app"

[project.entry-points.pytest11]
# Database fixtures for integration tests in core and plugins (M0S-E04-04).
hearthos = "hearthos_core.testing"

[tool.uv.sources]
hearthos-sdk = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
