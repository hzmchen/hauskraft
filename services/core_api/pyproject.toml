# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "hauskraft-core"
version = "0.1.0"
description = "Hauskraft core API (FastAPI)."
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "hauskraft-sdk",
    "fastapi~=0.148.0",
    "uvicorn[standard]~=0.54.0",
    "pydantic>=2.12,<3",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.1.4",
    "psycopg[binary]~=3.3",
    "structlog~=26.1",
    "alembic~=1.20",
    "uuid6>=2025.0.1",
    "jsonschema~=4.26",
    "pwdlib[argon2]~=0.3.1",
    "typer~=0.27",
    "semantic-version~=2.10",
    "coloraide~=8.13",
    "defusedxml~=0.7.1",
    "cryptography~=50.0",
    "pydantic-ai-slim[openai]~=2.61",
]

[project.scripts]
hauskraft = "hauskraft_core.cli:app"

[project.entry-points.pytest11]
# Database fixtures for integration tests in core and plugins (M0S-E04-04).
hauskraft = "hauskraft_core.testing"

[tool.uv.sources]
hauskraft-sdk = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
