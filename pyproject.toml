# Virtual uv workspace root. Each member has its own pyproject.toml and licence.

[tool.uv.workspace]
members = ["services/core_api", "packages/sdk-py", "plugins/official/tasks/backend"]

[tool.uv.sources]
hauskraft-core = { workspace = true }
hauskraft-sdk = { workspace = true }
hauskraft-tasks = { workspace = true }

[dependency-groups]
# The acceptance suite pins (mirrors tests/requirements.txt, which stays for pip-only runs).
dev = [
    "hauskraft-core",
    "hauskraft-sdk",
    "hauskraft-tasks",
    "pytest==9.1.1",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    # Python tooling (M0S-E01-02)
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest-asyncio==1.4.0",
    "pydantic>=2.12",  # loaded by the pydantic.mypy plugin
    "testcontainers[postgres]~=4.15",  # integration tests (M0S-E04-01, M0S-E04-04)
    "types-jsonschema~=4.26",
    "schemathesis~=4.32",  # API fuzzing in the contract job (M0S-E03-05)
    "types-defusedxml~=0.7.0",
    "pydantic-evals~=2.61",  # on-demand real-model evals of the assistant (M2S-E09-01, ADR 0022)
]

# ---------------------------------------------------------------- ruff (M0S-E01-02)
[tool.ruff]
target-version = "py313"
line-length = 120
# The spec-owned acceptance suite and backlog tooling keep their own style (AGENTS.md rule: never edit
# tests/acceptance, tests/e2e or tests/fixtures to get to green).
extend-exclude = [
    "tests/acceptance", "tests/e2e", "tests/fixtures", "tests/meta", "tests/_support", "tests/conftest.py",
    "scripts/backlog_tools.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "PT", "RUF", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["hauskraft_core", "hauskraft_sdk", "hauskraft_tasks", "hauskraft_evals"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Licence boundary (spec §4.2): plugins import only hauskraft_sdk, never core internals.
"hauskraft_core".msg = "Plugins may import only hauskraft_sdk, never hauskraft_core (spec §4.2)."

[tool.ruff.lint.per-file-ignores]
# The ban applies to plugin code only; everything outside plugins/ may import core.
"!plugins/**" = ["TID251"]
# Tests assert and use fixtures freely.
"**/tests/**" = ["S101", "S105", "S106", "S603", "S607", "PT012"]

# ---------------------------------------------------------------- mypy (M0S-E01-02)
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["services/core_api/src", "packages/sdk-py/src", "plugins/official/tasks/backend/src", "evals"]
files = ["services/core_api/src", "packages/sdk-py/src", "plugins/official/tasks/backend/src", "evals/hauskraft_evals"]

[[tool.mypy.overrides]]
module = ["semantic_version"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest (M0S-E01-02)
# Package tests live next to their code (services/*/tests, packages/*/tests, plugins/**/tests) and
# run separately from the spec-owned suite in tests/, whose conftest requires story markers.
[tool.pytest.ini_options]
# `uv run pytest` without arguments runs the package tests; the spec-owned suite runs as `pytest tests`.
testpaths = ["services", "packages", "plugins", "evals"]
# The eval runner (M2S-E09-01) is a plain package next to its datasets, not a workspace member.
pythonpath = ["evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure tests without I/O",
    "integration: needs a database (Testcontainers Postgres)",
    "contract: checks schemas and the OpenAPI contract",
]
filterwarnings = [
    # Starlette 1.7 deprecates httpx in its TestClient in favour of httpx2; FastAPI's TestClient still uses it.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
