<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HearthOS</title>
    <script>(function(){var m="system";try{m=localStorage.getItem("hearthos.mode")||m}catch(e){}var d=m==="dark"||(m!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d)})();</script>
    <link rel="stylesheet" href="/api/v1/theme/active.css" data-hearth-theme-css />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
