# For the `alembic` CLI from the repo root (uv run alembic upgrade heads). The API and the `hearthos` CLI
# build the same configuration in code (hearthos_core.db.migrations), including plugins found through
# HEARTHOS_PLUGIN_PATHS. The database URL comes from HEARTHOS_DATABASE_URL.
[alembic]
script_location = %(here)s/services/core_api/migrations
path_separator = os
version_locations = %(here)s/services/core_api/migrations/versions

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
